services:
  - type: web
    name: tw-jp-price-api
    env: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: adjoined-b367d
      - key: APP_ENV
        value: production
      - key: JPY_TO_TWD_RATE
        value: "0.218"
      - key: SCRAPER_REQUEST_DELAY
        value: "1.5"
