name: Daily AI Code Improvement

on:
  schedule:
    # 01:00 UTC = 09:00 Taiwan time, after cache warm-up finishes
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Improvement focus (optional, e.g. "scraper", "ui", "trending")'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  daily-improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set date variable
        run: echo "TODAY=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Determine improvement focus
        run: |
          # Rotate through focus areas by day-of-week
          DOW=$(date +%u)  # 1=Mon, 7=Sun
          INPUT="${{ github.event.inputs.focus }}"
          if [ -n "$INPUT" ]; then
            FOCUS="$INPUT"
          elif [ "$DOW" = "1" ] || [ "$DOW" = "5" ]; then
            FOCUS="trending"
          elif [ "$DOW" = "2" ] || [ "$DOW" = "6" ]; then
            FOCUS="scraper"
          elif [ "$DOW" = "3" ]; then
            FOCUS="ui"
          elif [ "$DOW" = "4" ]; then
            FOCUS="gemini_prompts"
          else
            FOCUS="misc"
          fi
          echo "FOCUS=$FOCUS" >> $GITHUB_ENV
          echo "Today's focus: $FOCUS"

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            You are performing a daily improvement task for the tw-jp-price-comparison project.
            Today: ${{ env.TODAY }}  |  Focus area: ${{ env.FOCUS }}

            ## Project Overview
            - **Backend**: FastAPI (app/) deployed on Render.com free tier (Singapore)
            - **Frontend**: Expo/React Native Web (mobile/) deployed to GitHub Pages
            - **Database**: Firebase Firestore (price_cache + search_history collections)
            - **AI**: Google Gemini with google_search_retrieval grounding for live prices
            - **IP blocking**: All major e-commerce platforms block Render's cloud IPs,
              so real prices come from Gemini grounding; HTML scrapers are a best-effort fallback

            ## Focus Area Instructions

            ### trending
            Update `mobile/app/index.tsx` TRENDING array with 6 currently popular/seasonal
            products in Taiwan/Japan. Consider: gaming, electronics, beauty, fashion for the
            current month (${{ env.TODAY }}). Keep emojis. Keep exactly 6 items.

            ### scraper
            Review `app/services/scraper.py` HTML selectors and improve robustness:
            - Add alternative CSS selectors for platforms that may have changed layout
            - Improve the Gemini fallback prompts for more accurate prices
            - Ensure Yodobashi and BIC Camera scrapers have wide enough CSS selectors

            ### ui
            Review `mobile/components/` and `mobile/app/` for one meaningful UI polish:
            - Improve spacing, typography, or color contrast
            - Add helpful empty states or micro-interactions
            - Make loading or error states more informative
            - DO NOT change core app logic, only visual/UX layer

            ### gemini_prompts
            Review AI prompts in `app/services/` (advisor.py, ai_agent.py, scraper.py):
            - Improve price accuracy by tightening the JSON format instructions
            - Add better handling for edge cases (bundles, accessories confusion)
            - Improve the buying advice verdict to be more actionable

            ### misc
            Choose whichever small improvement would have the most impact:
            - Fix any TypeScript strict-mode warnings
            - Improve Python type annotations
            - Add missing error handling
            - Improve logging messages

            ## Rules
            1. Make ONLY focused, safe changes matching the focus area
            2. No large refactors — one clear improvement per day
            3. Run `cd mobile && npx tsc --noEmit` to verify TypeScript is clean before committing
            4. Run `python -m py_compile app/**/*.py` if you touch backend files
            5. Commit to branch `claude/daily-${{ env.TODAY }}-${{ env.FOCUS }}`
            6. Create a PR targeting `main` with:
               - Clear title: what was improved
               - Body: what changed and why, with a short test plan
          max_turns: 20
